name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest
        env:
          # Deliberately absent: ANTHROPIC_API_KEY, GOOGLE_SPREADSHEET_ID
          # All tests run in mock mode — no real API calls made
          PYTHONDONTWRITEBYTECODE: "1"
